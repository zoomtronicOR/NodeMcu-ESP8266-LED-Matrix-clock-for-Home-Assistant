; Matrični sat V3 — ESP8266 NodeMCU ili ESP32-C3 SuperMini + 3-16 MAX7219 modula ili WS2812B 8×24 do 8×64
;
;   pio run -e nodemcuv2 -t upload    ESP8266 NodeMCU (podrazumevano)
;   pio run -e esp32c3 -t upload      ESP32-C3 SuperMini
; Pinovi ploča su u src/board.h i u README-u.

[platformio]
default_envs = nodemcuv2

; zajedničko za sva okruženja
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    majicdesigns/MD_Parola@^3.7.3
    majicdesigns/MD_MAX72XX@^3.5.1
    bblanchon/ArduinoJson@^7.2.1
    marvinroger/AsyncMqttClient@^0.9.0
    makuna/NeoPixelBus@2.8.4
; generisanje fontova i ugrađenog web UI-ja pre svakog builda
extra_scripts =
    pre:tools/gen_fonts.py
    pre:tools/embed_web.py
    pre:tools/build_info.py

; ---------------------------------------------------------------- ESP8266 NodeMCU

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2

; 4 MB flash: ~1 MB LittleFS, ostatak za firmware + rezervu za OTA
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L

upload_port = COM8
upload_speed = 460800
monitor_port = COM8
monitor_filters = esp8266_exception_decoder, time

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DARDUINOJSON_USE_LONG_LONG=0
    -DARDUINOJSON_ENABLE_PROGMEM=1
    -Wall

lib_deps =
    ${env.lib_deps}
    esp32async/ESPAsyncTCP@2.0.0

; Ažuriranje preko mreže (ArduinoOTA/espota). Lozinka = admin lozinka iz web UI-ja,
; zadaje se promenljivom okruženja, ne upisuje se u fajl:
;   PowerShell:  $env:MATRIX_OTA_PASS="..." ; pio run -e ota -t upload
;   bash:        MATRIX_OTA_PASS=... pio run -e ota -t upload
; Ime uređaja (mDNS) promeniti ako nije podrazumevano, ili navesti IP adresu.
[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = matrixclock-69bf.local
upload_flags =
    --port=8266
    --auth=${sysenv.MATRIX_OTA_PASS}

; ---------------------------------------------------------------- ESP32-C3 SuperMini

; ESP32-C3FH4: 4 MB flash u čipu, USB-C direktno na čipu (bez CH340), BOOT taster na GPIO9.
; Arduino core 3.x (pioarduino). Port se pronalazi sam; ako upload ne uspe, drži BOOT,
; uključi USB kabl, pusti BOOT i ponovi upload.
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
; 2 x 1,9 MB za firmware (OTA) + 128 KB LittleFS (konfiguracija zauzima nekoliko KB)
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NeoPixelBus (WS2812B) koristi stari RMT drajver; digitalWrite() sa RGB_BUILTIN bi uvukao
    ; novi, a ESP-IDF pri pokretanju prekida rad ako su linkovana oba
    -DESP32_ARDUINO_NO_RGB_BUILTIN
    -DARDUINOJSON_USE_LONG_LONG=0
    -Wall
    ; Ako se ploča ne povezuje na Wi-Fi ili često gubi vezu (poznat problem antene na nekim
    ; serijama SuperMini ploča), ukloni ";" ispred sledećeg reda — smanjuje snagu predajnika:
    ; -DMATRIX_WIFI_TX_POWER=WIFI_POWER_8_5dBm

lib_deps =
    ${env.lib_deps}
    esp32async/AsyncTCP@3.5.0

; Mrežni OTA za ESP32-C3, isto kao env:ota (port 8266, lozinka u MATRIX_OTA_PASS).
; upload_port: mDNS ime sata (matrixclock-xxxx.local) ili IP adresa.
[env:ota_c3]
extends = env:esp32c3
upload_protocol = espota
upload_port = matrixclock-xxxx.local
upload_flags =
    --port=8266
    --auth=${sysenv.MATRIX_OTA_PASS}
