; Matrični sat V3 — ESP8266 NodeMCU + 4x MAX7219 (8x32)

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

; 4 MB flash: ~1 MB LittleFS, ostatak za firmware + rezervu za budući OTA
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
board_build.f_cpu = 80000000L

upload_port = COM8
upload_speed = 460800
monitor_port = COM8
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
    -DARDUINOJSON_USE_LONG_LONG=0
    -DARDUINOJSON_ENABLE_PROGMEM=1
    -Wall

lib_deps =
    majicdesigns/MD_Parola@^3.7.3
    majicdesigns/MD_MAX72XX@^3.5.1
    bblanchon/ArduinoJson@^7.2.1
    esp32async/ESPAsyncTCP@2.0.0
    marvinroger/AsyncMqttClient@^0.9.0

; generisanje fontova i ugrađenog web UI-ja pre svakog builda (nasleđuje i env:ota)
extra_scripts =
    pre:tools/gen_fonts.py
    pre:tools/embed_web.py

; Ažuriranje preko mreže (ArduinoOTA/espota). Lozinka = admin lozinka iz web UI-ja,
; zadaje se promenljivom okruženja, ne upisuje se u fajl:
;   PowerShell:  $env:MATRIX_OTA_PASS="..." ; pio run -e ota -t upload
;   bash:        MATRIX_OTA_PASS=... pio run -e ota -t upload
; Ime uređaja (mDNS) promeniti ako nije podrazumevano, ili navesti IP adresu.
[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = matrixclock-69bf.local
upload_flags =
    --port=8266
    --auth=${sysenv.MATRIX_OTA_PASS}
